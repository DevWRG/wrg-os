version: 2
updates:
  # JS/TS monorepo (npm ecosystem mendukung pnpm-lock.yaml).
  # Minor + patch DIGABUNG jadi satu PR; MAJOR datang sebagai PR terpisah
  # (tidak dibundel) agar bisa dievaluasi satu-satu — bundel "semua" sebelumnya
  # mencampur patch aman dengan breaking major (TS6, eslint10, hono-server v2).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Major yang sengaja DITUNDA — minor/patch tetap diterima, hanya bump major
    # yang diabaikan sampai upgrade terencana (lihat triage PR #65/#67/#68).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hono/node-server"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — gabung semua.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Base image Dockerfile (per-service). ABAIKAN bump MAJOR — base image
  # di-pin sengaja (node:20-slim, python:3.12-slim); hanya terima patch/minor
  # dalam major yang sama. Bump LTS berikutnya dilakukan manual + uji build.
  - package-ecosystem: "docker"
    directories:
      - "/apps/web"
      - "/apps/api"
      - "/services/ai"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  # Python deps services/ai — minor/patch digabung.
  - package-ecosystem: "pip"
    directory: "/services/ai"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        update-types: ["minor", "patch"]
    # uvicorn & fastapi DIABAIKAN sepenuhnya, bukan sekadar major-nya: rilis
    # berikutnya keduanya menuntut Python >=3.10 sedangkan runtime produksi
    # masih 3.9.6, jadi PR-nya tak akan pernah bisa dirilis. #952 (uvicorn
    # >=0.52.3) sempat lolos & masuk main karena CI dulu memakai 3.12 —
    # requirement-nya naik tapi venv produksi tetap di 0.39.0.
    # Buka kembali aturan ini SETELAH interpreter produksi naik ke >=3.10.
    # Lihat catatan lengkap di services/ai/requirements.txt.
    ignore:
      - dependency-name: "uvicorn"
      - dependency-name: "fastapi"
