name: WRG-OS CI

# Lint · typecheck · build (pnpm monorepo) + import-check services/ai.
# Pada push ke main: build & push image web/api/ai ke GHCR.
# TIDAK ada auto-deploy — deploy tetap manual/terkontrol manusia agar sistem
# Python produksi (port 8090–8092) tidak pernah tersentuh otomatis.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Pemicu manual — jaring pengaman saat GitHub Actions bermasalah.
  #
  # 26 Agu 2026 Actions kena major outage (database primary + throttling
  # traffic masuk). Run-run yang sudah ter-antre saat itu TIDAK pernah
  # terangkat: #1059 masuk ke `dev` tanpa pernah disentuh CI sama sekali, dan
  # tak ada cara memicunya ulang — `gh run rerun` menolak ("workflow is already
  # running") dan workflow ini cuma punya pemicu push/pull_request. Satu-satunya
  # jalan tersisa adalah commit palsu ke dev. Sejak sekarang: Actions → pilih
  # "WRG-OS CI" → Run workflow, pada ref mana pun.
  workflow_dispatch:

jobs:
  check:
    name: Lint · Typecheck · Build (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Test unit apps/api (97 test: parser #PLAN/#REPORT, tanggal, insentif, NPK).
      # Sebelumnya tak pernah jalan di CI — apps/api tak punya script `test`, jadi
      # `turbo run test` melewatinya tanpa suara dan pipeline tetap hijau.
      - run: pnpm test
      # Migrasi dieksekusi menurut urutan abjad nama file (scripts/db/migrate.sh),
      # jadi nomor ganda = urutan tak tentu, dan tak ada yang gagal sampai deploy
      # hampir menyentuh skema prod. Cek ini menolak tabrakan BARU; 11 nomor yang
      # sudah bertabrakan dicatat sebagai baseline (utang) di dalam skripnya.
      - run: node scripts/db/check-migration-numbers.mjs
      # Rumus Simulator KSO menghitung harga penawaran KSO yang dikirim ke faskes.
      # Salah angka = penawaran salah, dan layarnya tetap tampil wajar — tidak ada
      # yang gagal sendiri (PR #803: control XR memakai harga XN, lolos semua cek).
      # Bandingkan dengan angka acuan dari aplikasi rujukan.
      - name: Paritas Simulator KSO
        run: node scripts/ops/kso-parity.mjs

  ai-check:
    name: services/ai import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # SAMA dengan runtime produksi (pm2 native, .venv Python 3.9.6).
          # Sebelumnya 3.12: CI memasang rilis yang menuntut >=3.10 dan lolos,
          # padahal produksi tak pernah bisa memasangnya. Itu yang meloloskan
          # #952 (uvicorn>=0.52.3). Kalau interpreter produksi naik, angka di
          # sini yang naik lebih dulu.
          python-version: "3.9"
      - run: pip install -r services/ai/requirements.txt
      - name: Import FastAPI app
        working-directory: services/ai
        run: python -c "import app.main; print('services/ai import ok')"

  build-images:
    name: Build & Push Images (web/api/ai)
    runs-on: ubuntu-latest
    needs: [check, ai-check]
    # Hanya pada PUSH ke main — bukan pada workflow_dispatch. Dispatch dipakai
    # untuk MENGULANG pemeriksaan yang hilang, bukan untuk merilis; tanpa syarat
    # event ini, sekali klik "Run workflow" di main akan ikut mem-push ulang
    # tag `:latest` ke GHCR sebagai efek samping yang tak diminta siapa pun.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: ai, dockerfile: services/ai/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/devwrg/wrg-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/devwrg/wrg-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
