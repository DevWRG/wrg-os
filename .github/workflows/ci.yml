name: WRG-OS CI

# Lint · typecheck · build (pnpm monorepo) + import-check services/ai.
# Pada push ke main: build & push image web/api/ai ke GHCR.
# TIDAK ada auto-deploy — deploy tetap manual/terkontrol manusia agar sistem
# Python produksi (port 8090–8092) tidak pernah tersentuh otomatis.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: Lint · Typecheck · Build (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  ai-check:
    name: services/ai import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r services/ai/requirements.txt
      - name: Import FastAPI app
        working-directory: services/ai
        run: python -c "import app.main; print('services/ai import ok')"

  build-images:
    name: Build & Push Images (web/api/ai)
    runs-on: ubuntu-latest
    needs: [check, ai-check]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: ai, dockerfile: services/ai/Dockerfile }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/devwrg/wrg-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/devwrg/wrg-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
