name: Sync State On Release
# Path: .github/workflows/sync-state-on-release.yml
#
# Trigger: tiap ada release published (auto-tag via release.yml feat=minor fix=patch)
# Action: regenerate state/dashboard-state.json + release-log.json → BUKA PR ke main
# (mode PR, bukan push langsung — aman utk branch protection; owner tinggal merge).
# Companion ke scripts/ops/sync-state.sh (cron daily fallback).

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup jq
        run: sudo apt-get install -y jq

      - name: Get release info
        id: release
        run: |
          echo "tag=${{ github.event.release.tag_name || 'manual' }}" >> $GITHUB_OUTPUT
          echo "published=${{ github.event.release.published_at || '' }}" >> $GITHUB_OUTPUT
          TOTAL=$(gh release list --limit 1000 --json tagName -q '. | length')
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update dashboard-state.json
        run: |
          mkdir -p state
          TAG="${{ steps.release.outputs.tag }}"
          PUBLISHED="${{ steps.release.outputs.published }}"
          TOTAL="${{ steps.release.outputs.total }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -f state/dashboard-state.json ]; then
            jq --arg v "$TAG" --arg p "$PUBLISHED" --arg n "$NOW" --argjson t "$TOTAL" '
              .lastUpdate = $n |
              .production.version = $v |
              .production.releasedAt = $p |
              .production.totalReleases = $t |
              .generatedBy = "github-actions-on-release"
            ' state/dashboard-state.json > state/dashboard-state.json.new
            mv state/dashboard-state.json.new state/dashboard-state.json
          else
            echo "⚠️ state/dashboard-state.json not found — bootstrap dulu"
            exit 1
          fi

      - name: Update release-log.json
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          TOTAL="${{ steps.release.outputs.total }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RELEASES=$(gh release list --limit 20 --json tagName,publishedAt,name | jq -c '
            [.[] | { tag: .tagName, date: (.publishedAt | split("T")[0]), summary: .name }]')
          jq --arg n "$NOW" --arg t "$TAG" --argjson tot "$TOTAL" --argjson rel "$RELEASES" '
            .lastUpdate = $n | .totalReleases = $tot | .latest = $t | .releases = $rel
          ' state/release-log.json > state/release-log.json.new
          mv state/release-log.json.new state/release-log.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Buka PR (mode PR — bukan push langsung ke main)
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: state-sync/release-${{ steps.release.outputs.tag }}
          delete-branch: true
          add-paths: state/*.json
          commit-message: |
            chore(state): auto-sync on release ${{ steps.release.outputs.tag }}

            Total releases: ${{ steps.release.outputs.total }}
            Generated by: github-actions-on-release (PR mode)
          title: "chore(state): auto-sync on release ${{ steps.release.outputs.tag }}"
          body: |
            Auto-generated state update dari release **${{ steps.release.outputs.tag }}**.

            - production.version → ${{ steps.release.outputs.tag }}
            - totalReleases → ${{ steps.release.outputs.total }}
            - release-log.json → 20 rilis terbaru

            Merge utk update dashboard SoT (`state/*.json`). Data-only (no code).
          labels: state-sync, automated

      - name: Summary
        run: |
          echo "### State Sync PR dibuka 🎉" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ steps.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total releases:** ${{ steps.release.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: PR (owner merge utk update SoT)" >> $GITHUB_STEP_SUMMARY
