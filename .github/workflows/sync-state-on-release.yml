name: Sync State On Release
# Path: .github/workflows/sync-state-on-release.yml
#
# Trigger: tiap ada release published (auto-tag via release.yml feat=minor fix=patch)
# Action: regenerate state/dashboard-state.json + release-log.json + commit ke main
# Companion ke scripts/ops/sync-state.sh (cron daily fallback)
#
# Husni decision 2026-06-20: Fase 3 enabled paralel dengan Fase 2 cron daily.

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  sync-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup jq
        run: sudo apt-get install -y jq

      - name: Get release info
        id: release
        run: |
          echo "tag=${{ github.event.release.tag_name || 'manual' }}" >> $GITHUB_OUTPUT
          echo "published=${{ github.event.release.published_at || github.event.workflow_run.created_at }}" >> $GITHUB_OUTPUT
          # Count total releases
          TOTAL=$(gh release list --limit 1000 --json tagName -q '. | length')
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update dashboard-state.json
        run: |
          mkdir -p state
          TAG="${{ steps.release.outputs.tag }}"
          PUBLISHED="${{ steps.release.outputs.published }}"
          TOTAL="${{ steps.release.outputs.total }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Update fields via jq (preserve existing infrastructure + catalog metadata)
          if [ -f state/dashboard-state.json ]; then
            jq --arg v "$TAG" --arg p "$PUBLISHED" --arg n "$NOW" --argjson t "$TOTAL" '
              .lastUpdate = $n |
              .production.version = $v |
              .production.releasedAt = $p |
              .production.totalReleases = $t |
              .generatedBy = "github-actions-on-release"
            ' state/dashboard-state.json > state/dashboard-state.json.new
            mv state/dashboard-state.json.new state/dashboard-state.json
          else
            echo "⚠️ state/dashboard-state.json not found — bootstrap via Husni manual init dulu"
            exit 1
          fi

      - name: Update release-log.json
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          TOTAL="${{ steps.release.outputs.total }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Generate fresh release-log dari gh CLI (20 latest)
          RELEASES=$(gh release list --limit 20 --json tagName,publishedAt,name | jq -c '
            [.[] | {
              tag: .tagName,
              date: (.publishedAt | split("T")[0]),
              summary: .name
            }]')

          jq --arg n "$NOW" --arg t "$TAG" --argjson tot "$TOTAL" --argjson rel "$RELEASES" '
            .lastUpdate = $n |
            .totalReleases = $tot |
            .latest = $t |
            .releases = $rel
          ' state/release-log.json > state/release-log.json.new
          mv state/release-log.json.new state/release-log.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore(state): auto-sync on release ${{ steps.release.outputs.tag }}

            Triggered by: ${{ github.event_name }}
            Total releases: ${{ steps.release.outputs.total }}
            Generated by: github-actions-on-release
          file_pattern: 'state/*.json'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Summary
        run: |
          echo "### State Sync Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ steps.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total releases:** ${{ steps.release.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- **State files updated:** dashboard-state.json + release-log.json" >> $GITHUB_STEP_SUMMARY
          echo "- **Direktur dashboard akan auto-update** via raw.githubusercontent.com fetch" >> $GITHUB_STEP_SUMMARY
