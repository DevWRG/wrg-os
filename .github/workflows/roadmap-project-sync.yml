name: Roadmap Project Sync

# Sinkronkan status item board "WRG-OS Roadmap" (project #2) dari event PR.
# - PR dibuka/reopened/ready  -> item ber-F-number cocok jadi "In Progress"
# - PR merged ke `dev`        -> "Checking" (sudah dibangun, BELUM di prod)
# - PR merged ke `main`       -> "Done" (sudah dipromosikan & rilis)
# - PR merged ke base lain / closed tanpa merge -> diabaikan
# Status akhir mengikuti BASE BRANCH, bukan sekadar "merged". Sebelumnya semua merge
# jadi Done, jadi 43 fitur yang cuma nangkring di `dev` tampil seolah sudah live.
# Konsekuensi yang disengaja: item Done bisa turun ke Checking kalau ada PR lanjutan
# masuk `dev` — itu memang berarti ada bagian menggantung yang belum dipromosikan;
# merge promosi ke `main` akan mengembalikannya ke Done.
# F-number diambil dari nama branch + judul PR (mis. feat/f127-... / feat(F127): ...).
# Jika F-number belum ada di board, item draft baru DIBUAT otomatis lalu di-set status.
# Butuh secret PROJECTS_TOKEN (PAT dgn izin project) karena GITHUB_TOKEN default
# tidak bisa menulis Projects v2. Keabsahan token diuji di AWAL job, sebelum
# early-return F-number — kalau tidak, token mati lolos sebagai `success` di
# setiap PR yang kebetulan tak ber-F-number (lihat komentar di dalam script).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  sync:
    # PR dependabot tak dapat akses secrets.PROJECTS_TOKEN (secret store terpisah) &
    # tak pernah punya F-number → skip biar tidak gagal palsu.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const projectId     = 'PVT_kwHOEMRLCs4BbQ3-';
            const statusFieldId = 'PVTSSF_lAHOEMRLCs4BbQ3-zhWCl6w';
            const OPT = {
              'In Progress': '47fc9ee4',
              'Checking':    '4d5bc88f',
              'Done':        '98236657',
            };
            // Base branch -> status saat PR MERGED. Base di luar peta ini diabaikan.
            const MERGE_TARGET = { dev: 'Checking', main: 'Done' };

            // ── Uji kredensial DULUAN, sebelum early-return apa pun ──────────
            // Tanpa ini kematian token TERSAMAR: jalur "tak ada F-number" keluar
            // lebih awal tanpa pernah menyentuh API, jadi run selesai `success`.
            // PROJECTS_TOKEN dibuat 15 Jul; dengan expiry 30 hari ia mati sekitar
            // 14 Agu 2026 dan baru ketahuan 27 Agu, saat kebetulan ada PR
            // ber-F-number (#1072). Sepanjang rentang itu papan berhenti
            // ter-update sementara tiap PR tetap hijau. Cek ini menukar diam
            // yang lama dengan gagal yang cepat: satu query murah di SETIAP PR.
            //
            // Yang dibaca adalah project-nya sendiri, bukan `viewer { login }`.
            // `viewer` cuma membuktikan token sah — token tanpa scope `project`
            // LOLOS di situ lalu gagal belakangan, persis kelas kegagalan yang
            // mau dihapus. Membaca ProjectV2 membuktikan sah DAN cukup scope.
            try {
              const probe = await github.graphql(
                `query($id:ID!){ node(id:$id){ ... on ProjectV2 { number title } } }`,
                { id: projectId },
              );
              if (!probe?.node?.number) throw new Error('project tak terbaca (node kosong)');
              core.info(`Token OK — papan #${probe.node.number} "${probe.node.title}" terbaca.`);
            } catch (e) {
              core.setFailed(
                `PROJECTS_TOKEN tidak bisa membaca papan Projects: ${e.message}\n\n` +
                'Status papan BERHENTI ter-update sampai ini dibereskan.\n\n' +
                'Rotasi — classic PAT, papan ini user-owned\n' +
                '(github.com/users/DevWRG/projects/2):\n' +
                '  1. https://github.com/settings/tokens/new — scope `project`,\n' +
                '     Expiration "No expiration". Expiry pendek adalah penyebab\n' +
                '     kejadian ini, bukan sekadar preferensi.\n' +
                '  2. gh secret set PROJECTS_TOKEN --repo DevWRG/wrg-os < <file-token>\n' +
                '  3. Perbarui juga ~/.wrg-gh-token — automation lain memakainya\n' +
                '  4. Sisir papan: transisi selama token mati tak pernah tercatat\n\n' +
                'Konteks: issue #1075.',
              );
              return;
            }

            const pr = context.payload.pull_request;
            let target;
            if (context.payload.action === 'closed') {
              if (!pr.merged) { core.info('PR closed tanpa merge — skip'); return; }
              const base = pr.base.ref;
              target = MERGE_TARGET[base];
              if (!target) {
                core.info(`PR merged ke base "${base}" (bukan dev/main) — skip`);
                return;
              }
              core.info(`PR merged ke "${base}" → ${target}`);
            } else {
              target = 'In Progress';
            }

            const text  = `${pr.head.ref}\n${pr.title}`;
            const fnums = [...new Set((text.match(/F\d{2,3}/gi) || []).map(s => s.toUpperCase()))];
            if (!fnums.length) { core.info('Tidak ada F-number — skip'); return; }
            core.info(`F-number: ${fnums.join(', ')} → ${target}`);

            // ambil semua item board (paginate)
            let items = [], cursor = null;
            do {
              const r = await github.graphql(
                `query($id:ID!,$c:String){ node(id:$id){ ... on ProjectV2 {
                   items(first:100, after:$c){
                     pageInfo{ hasNextPage endCursor }
                     nodes{ id content{
                       ... on DraftIssue{ title }
                       ... on Issue{ title }
                       ... on PullRequest{ title } } } } } } }`,
                { id: projectId, c: cursor });
              const conn = r.node.items;
              items.push(...conn.nodes);
              cursor = conn.pageInfo.hasNextPage ? conn.pageInfo.endCursor : null;
            } while (cursor);

            let touched = 0, created = 0;
            for (const f of fnums) {
              const re = new RegExp(`${f}(?!\\d)`, 'i'); // F12 tidak match F127
              let matches = items.filter(it => re.test(it.content?.title || ''));
              if (!matches.length) {
                // F-number belum ada di board → buat draft item baru.
                // Judul dijamin memuat F-number (di depan) agar match di run berikutnya.
                const cleaned = pr.title.replace(/^\s*[a-z]+(\([^)]*\))?!?:\s*/i, '').trim();
                const newTitle = `${f} — ${cleaned || pr.title}`;
                const res = await github.graphql(
                  `mutation($p:ID!,$t:String!){
                     addProjectV2DraftIssue(input:{ projectId:$p, title:$t }){
                       projectItem{ id content{ ... on DraftIssue{ title } } } } }`,
                  { p: projectId, t: newTitle });
                matches = [res.addProjectV2DraftIssue.projectItem];
                created++;
                core.info(`${f}: item baru dibuat → "${newTitle}"`);
              }
              for (const m of matches) {
                await github.graphql(
                  `mutation($p:ID!,$i:ID!,$fld:ID!,$o:String!){
                     updateProjectV2ItemFieldValue(input:{
                       projectId:$p, itemId:$i, fieldId:$fld,
                       value:{ singleSelectOptionId:$o } }){ projectV2Item{ id } } }`,
                  { p: projectId, i: m.id, fld: statusFieldId, o: OPT[target] });
                core.info(`${f}: "${m.content?.title}" → ${target}`);
                touched++;
              }
            }
            core.info(`Selesai — ${touched} item diperbarui, ${created} item baru dibuat.`);
