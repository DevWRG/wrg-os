# WRG-OS Docker Compose — runnable 3-tier stack.
# Stack: PostgreSQL 16 (pgvector) + services/ai (FastAPI) + apps/api (Hono) +
#        apps/web (Next.js dashboard/BFF).
#
#   cp .env.example .env   # isi PG_PASSWORD dll
#   docker compose up --build
#
# Akses: web http://localhost:3000 · api http://localhost:4000 ·
#        ai http://localhost:8000 · postgres host :5433 (internal :5432).
#
# Catatan:
#  • postgres init (infra/postgres/init/001-006.sql) jalan SEKALI saat volume
#    pg_data kosong — di image pgvector, 001 mengaktifkan extension `vector` &
#    membuat DB `langfuse` (jalur init penuh, beda dari subset lokal).
#  • Host pg dipetakan ke 5433 agar tak bentrok dengan postgres lokal (:5432).
#    Antar-service tetap memakai host internal `postgres:5432`.
#  • Service opsional (redis, langfuse, nginx) & legacy (crm/monitor) DIHAPUS
#    dari stack inti — bisa ditambah belakangan (langfuse v3 butuh ClickHouse;
#    nginx butuh upstream web/api di nginx.conf). Ingest WA kini = webhook di
#    apps/api (POST /webhooks/wa), bukan service wa-gateway terpisah.
#  • Auth default MATI (AUTH_ENABLED=false). Set true + JWT_SECRET +
#    API_SERVICE_TOKEN untuk mengaktifkan gerbang sesi.

name: wrg-os

networks:
  wrg-internal:
    driver: bridge

volumes:
  pg_data:

services:
  # ── DATABASE ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wrg-postgres
    restart: unless-stopped
    networks: [wrg-internal]
    environment:
      POSTGRES_DB: ${PG_DB:-wrg_os}
      POSTGRES_USER: ${PG_USER:-wrg}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-wrg_dev_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-wrg} -d ${PG_DB:-wrg_os}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI & DATA (Python FastAPI) ────────────────────────
  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: wrg-ai
    restart: unless-stopped
    networks: [wrg-internal]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PG_USER:-wrg}:${PG_PASSWORD:-wrg_dev_password}@postgres:5432/${PG_DB:-wrg_os}
      # OpenRouter: kunci LIVE ditaruh di sini (services/ai pemanggil LLM).
      # Kosong → semua endpoint AI fallback ke template (dry-run).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PORT: "8000"
    ports:
      - "8000:8000"

  # ── DOMAIN BACKEND (Hono) ─────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wrg-api
    restart: unless-stopped
    networks: [wrg-internal]
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${PG_USER:-wrg}:${PG_PASSWORD:-wrg_dev_password}@postgres:5432/${PG_DB:-wrg_os}
      AI_URL: http://ai:8000
      PORT: "4000"
      # Auth (default off). Service token = kepercayaan BFF→api.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-}
      # Scheduler agen (default off).
      AGENT_SCHEDULE_ENABLED: ${AGENT_SCHEDULE_ENABLED:-false}
      AGENT_CRON_TZ: ${AGENT_CRON_TZ:-Asia/Jakarta}
      AI_DRY_RUN: ${AI_DRY_RUN:-false}
      # Secret webhook & pengiriman keluar (kosong = mode dev/stub).
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET:-}
      ACCURATE_WEBHOOK_SECRET: ${ACCURATE_WEBHOOK_SECRET:-}
      WA_SEND_URL: ${WA_SEND_URL:-}
      WA_SEND_SECRET: ${WA_SEND_SECRET:-}
    ports:
      - "4000:4000"

  # ── FRONTEND + BFF (Next.js) ──────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wrg-web
    restart: unless-stopped
    networks: [wrg-internal]
    depends_on:
      api:
        condition: service_started
    environment:
      # BFF server-side → api lewat host internal compose.
      API_URL: http://api:4000
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
