events {
  worker_connections 1024;
}

http {
  upstream crm_app {
    server crm:3000;
  }
  upstream monitor_app {
    server monitor:3000;
  }
  upstream api_app {
    server api:4000;
  }

  # CRM — main app
  server {
    listen 80;
    server_name crm.wrg.local;
    location / {
      proxy_pass http://crm_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # Monitor Dashboard
  server {
    listen 80;
    server_name monitor.wrg.local;
    location / {
      proxy_pass http://monitor_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # API
  server {
    listen 80;
    server_name api.wrg.local;
    location / {
      proxy_pass http://api_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
